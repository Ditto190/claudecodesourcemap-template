name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Installation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Node.js version requirement
        run: node scripts/check-node-version.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate installation
        run: node scripts/validate-install.mjs

  lint:
    name: Lint (Script Syntax Check)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run syntax check on scripts
        run: npm run lint

  smoke-test:
    name: Smoke Test CLI
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Verify CLI is executable
        run: |
          node --version
          # The CLI requires API credentials at runtime; verify it at least parses and
          # exits with a non-crash code (exit 0 or exit 1 are both acceptable here).
          node cli.mjs --version; EXIT=$?; [ "$EXIT" -lt 2 ] || exit $EXIT
